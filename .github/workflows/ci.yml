name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careerpilot_test
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerpilot -d careerpilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://careerpilot:careerpilot@localhost:5432/careerpilot_test
      JWT_SECRET: ci-only-jwt-secret-value-that-is-long-enough
      AI_PROVIDER: mock
      OPENAI_API_KEY: ""
      CORS_ORIGINS: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Validate migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Import FastAPI application
        working-directory: backend
        run: python -c "from app.main import app; assert app is not None"

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_INTERNAL_URL: http://localhost:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend type check
        working-directory: frontend
        run: npm run typecheck

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate development Compose config
        run: docker compose config --quiet

      - name: Validate production Compose config
        env:
          POSTGRES_PASSWORD: careerpilot
          DATABASE_URL: postgresql+psycopg://careerpilot:careerpilot@db:5432/careerpilot
          JWT_SECRET: ci-only-production-secret-value-that-is-long-enough
          APP_URL: https://careerpilot.example
          CORS_ORIGINS: https://careerpilot.example
          NEXT_PUBLIC_API_URL: https://api.careerpilot.example
          BACKEND_INTERNAL_URL: http://backend:8000
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build production Docker images
        env:
          POSTGRES_PASSWORD: careerpilot
          DATABASE_URL: postgresql+psycopg://careerpilot:careerpilot@db:5432/careerpilot
          JWT_SECRET: ci-only-production-secret-value-that-is-long-enough
          APP_URL: https://careerpilot.example
          CORS_ORIGINS: https://careerpilot.example
          NEXT_PUBLIC_API_URL: https://api.careerpilot.example
          BACKEND_INTERNAL_URL: http://backend:8000
        run: docker compose -f docker-compose.prod.yml build backend frontend
