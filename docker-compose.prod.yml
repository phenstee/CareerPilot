services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot}
      POSTGRES_USER: ${POSTGRES_USER:-careerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - careerpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerpilot} -d ${POSTGRES_DB:-careerpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PORT: ${BACKEND_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      APP_URL: ${APP_URL:?Set APP_URL}
      BETA_ACCESS_CODE: ${BETA_ACCESS_CODE:-}
      REGISTRATION_RATE_LIMIT_COUNT: ${REGISTRATION_RATE_LIMIT_COUNT:-5}
      REGISTRATION_RATE_LIMIT_WINDOW_SECONDS: ${REGISTRATION_RATE_LIMIT_WINDOW_SECONDS:-3600}
      LOGIN_RATE_LIMIT_COUNT: ${LOGIN_RATE_LIMIT_COUNT:-10}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      RESUME_UPLOAD_RATE_LIMIT_COUNT: ${RESUME_UPLOAD_RATE_LIMIT_COUNT:-10}
      RESUME_UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${RESUME_UPLOAD_RATE_LIMIT_WINDOW_SECONDS:-86400}
      AI_RATE_LIMIT_COUNT: ${AI_RATE_LIMIT_COUNT:-20}
      AI_RATE_LIMIT_WINDOW_SECONDS: ${AI_RATE_LIMIT_WINDOW_SECONDS:-3600}
      JOB_SEARCH_RATE_LIMIT_COUNT: ${JOB_SEARCH_RATE_LIMIT_COUNT:-60}
      JOB_SEARCH_RATE_LIMIT_WINDOW_SECONDS: ${JOB_SEARCH_RATE_LIMIT_WINDOW_SECONDS:-3600}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-1}
      GREENHOUSE_BOARDS: ${GREENHOUSE_BOARDS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '8000') + '/api/v1/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${FRONTEND_PORT:-3000}
      APP_URL: ${APP_URL:?Set APP_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  careerpilot_postgres_data:
